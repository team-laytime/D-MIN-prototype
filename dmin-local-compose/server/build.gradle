plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

// D-MIN-server(팀 repo)와 같은 버전·패키지 규칙을 쓴다: Spring Boot 4.1.2, Java 25, com.dmin, /api 접두사.
// 다른 점: JPA 대신 JDBC(JdbcClient)를 쓴다. 작업 큐의 SKIP LOCKED와 JSONB를 SQL 그대로 다루기 위해서다.
group = 'com.dmin'
version = '0.1.0'
description = 'D-MIN server (local compose reference)'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		events 'failed'
		exceptionFormat 'full'
	}
}

// /api/system/status에 버전을 보여 주려고 build-info를 만든다.
springBoot {
	buildInfo()
}

// 실행용 boot jar만 만든다. plain jar까지 생기면 Dockerfile의 COPY 대상이 두 개가 된다.
tasks.named('jar') {
	enabled = false
}

tasks.named('bootRun') {
	systemProperty 'spring.profiles.active', 'local'
}
