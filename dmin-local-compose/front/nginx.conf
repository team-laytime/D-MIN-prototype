# D-MIN-front와 같은 모양(nginx-unprivileged, 8080). /api는 여기까지 오지 않는다: 앞의 Caddy가 Spring으로 보낸다.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # 보안 헤더 3개. location에 add_header가 하나라도 있으면 여기 값을 물려받지 않으므로
    # add_header를 쓰는 location(/assets/, /)에도 같은 3줄을 다시 적는다. /healthz는 여기 값을 받는다.
    # Referrer-Policy는 same-origin이면 안 된다: 지도 타일(tile.openstreetmap.org)은 Referer가 없는 브라우저 요청에
    # 'Access blocked' 그림을 준다. strict-origin-when-cross-origin은 다른 사이트에 주소 없이 출처(127.0.0.1:18089)만 보낸다.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 해시가 붙은 정적 파일은 오래 캐시, index.html은 매번 새로
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
