apiVersion: apps/v1
kind: Deployment
metadata:
  name: demurrage-api
spec:
  # 현재 Store가 시작 시 DDL을 실행한다. 초기 연결 단계에는 시작을 직렬화한다.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app.kubernetes.io/name: demurrage
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demurrage
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: demurrage-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: demurrage-app:REPLACE_ME
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: demurrage-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: demurrage-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 1Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: db-ca
              mountPath: /app/certs
              readOnly: true
            - name: runtime
              mountPath: /app/runtime
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: db-ca
          configMap:
            name: demurrage-db-ca
        - name: runtime
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
