apiVersion: batch/v1
kind: CronJob
metadata:
  name: demurrage-daily-report
spec:
  schedule: "0 9 * * *"
  timeZone: Asia/Seoul
  # 수동 Job의 S3 저장 확인 후 render_eks.py --enable-cron 으로 활성화한다.
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: demurrage
            app.kubernetes.io/component: batch
        spec:
          serviceAccountName: demurrage-batch
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: daily-report
              image: demurrage-app:REPLACE_ME
              imagePullPolicy: IfNotPresent
              command: [python, -m, demurrage.jobs.daily_report]
              envFrom:
                - configMapRef:
                    name: demurrage-config
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
                  ephemeral-storage: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 128Mi
