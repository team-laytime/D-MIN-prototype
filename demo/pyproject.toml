[project]
name = "chukhwabi-demurrage-demo"
version = "0.1.0"
description = "척화비 — 울산 CLX 체선료 최적화 Agent 데모 (결정론 계산 엔진 + Agent 오케스트레이션 + API·화면)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "python-docx>=1.1",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
aws = ["boto3>=1.35.99,<2"]
dev = ["pytest>=8", "httpx>=0.27", "PyYAML>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q -p no:cacheprovider"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
demurrage = ["web/*", "web/assets/*"]
